[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blockpulse"
version = "0.1.0"
description = "Python-only multi-chain health and liquidity intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "eth-utils>=5,<6",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
blockpulse-collect = "blockpulse.cli:main"
blockpulse-collect-loop = "blockpulse.cli:worker_main"
blockpulse-migrate = "blockpulse.infrastructure.database.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blockpulse"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
