services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blockpulse
      POSTGRES_USER: blockpulse
      POSTGRES_PASSWORD: blockpulse
    ports:
      - "5432:5432"
    volumes:
      - blockpulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockpulse -d blockpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  blockpulse:
    build: .
    env_file:
      - .env
    environment:
      BLOCKPULSE_DATABASE_URL: postgresql+psycopg://blockpulse:blockpulse@postgres:5432/blockpulse
      BLOCKPULSE_ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  blockpulse-collector:
    build: .
    command: ["blockpulse-collect-binance-loop"]
    env_file:
      - .env
    environment:
      BLOCKPULSE_DATABASE_URL: postgresql+psycopg://blockpulse:blockpulse@postgres:5432/blockpulse
      BLOCKPULSE_ENVIRONMENT: development
      BLOCKPULSE_METRICS_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - blockpulse
      - blockpulse-collector

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: blockpulse
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - blockpulse-grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  blockpulse-postgres:
  blockpulse-grafana:
