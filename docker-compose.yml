services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blockpulse
      POSTGRES_USER: blockpulse
      POSTGRES_PASSWORD: blockpulse
    ports:
      - "5432:5432"
    volumes:
      - blockpulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockpulse -d blockpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blockpulse-postgres:

